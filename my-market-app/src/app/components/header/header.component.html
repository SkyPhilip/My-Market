
    <header class="header">
      <div class="header__left">
        <a class="header__brand" (click)="navigateTo('/dashboard')">Forster Market App</a>
        <span class="header__datetime">{{ currentTime() }}</span>
        <span class="header__market-status" [class.open]="marketOpen()" [class.closed]="!marketOpen()">
          {{ marketOpen() ? 'Market Open' : 'Market Closed' }}
        </span>
      </div>
      <nav class="header__nav">
        <a class="header__link" routerLink="/dashboard" routerLinkActive="header__link--active">Dashboard</a>
        <a class="header__link" routerLink="/watch-lists" routerLinkActive="header__link--active">Watch Lists</a>
        <a class="header__link" routerLink="/money-flow" routerLinkActive="header__link--active">Money Flow</a>
        <a class="header__link" routerLink="/high-yield" routerLinkActive="header__link--active">High Yield</a>
        <a class="header__link" routerLink="/history" routerLinkActive="header__link--active">History</a>
        <a class="header__link" routerLink="/settings" routerLinkActive="header__link--active">Settings</a>
        <button class="header__logout" (click)="onLogout()">Logout</button>
      </nav>
    </header>
